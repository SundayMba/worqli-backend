services:
  postgres:
    image: postgres:16-alpine
    container_name: servika-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: servika
      POSTGRES_USER: servika
      POSTGRES_PASSWORD: servika_dev_password
    ports:
      - '5433:5432'
    volumes:
      - servika_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U servika -d servika']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: servika-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - servika_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  servika_pgdata:
  servika_redisdata:
