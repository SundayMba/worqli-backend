# Production compose — runs the WHOLE backend (API + Postgres + Redis) together on
# the server, unattended and auto-restarting. This is different from docker-compose.yml
# (which only runs Postgres + Redis for local dev, while you run the API by hand).
#
# Secrets are read from a `.env` file that lives ONLY on the server (never committed).
# Deploys are automatic: GitHub Actions builds + pushes the API image to GHCR, then
# AWS SSM runs `docker compose -f docker-compose.prod.yml pull && up -d` on the server.
# (Postgres + Redis still use public images and are built by nobody.)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: servika
      POSTGRES_USER: servika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - servika_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U servika -d servika']
      interval: 5s
      timeout: 5s
      retries: 5
    # No `ports:` — the database is reachable only by the API over the private
    # compose network, never exposed to the internet.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - servika_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    # No `ports:` — internal only.

  api:
    # Prebuilt image from GHCR, built + pushed by GitHub Actions on every push to main.
    # The VM only PULLS and runs it — no build load on the server. IMAGE_TAG lets you
    # pin/roll back to a specific commit's image; it defaults to the newest push.
    image: ghcr.io/sundaymba/worqli-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The API reaches Postgres/Redis by their service name on the compose network.
      ConnectionStrings__Postgres: 'Host=postgres;Port=5432;Database=servika;Username=servika;Password=${POSTGRES_PASSWORD}'
      ConnectionStrings__Redis: 'redis:6379'
      # Secrets — all pulled from the server's .env file:
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Resend__ApiKey: ${RESEND_API_KEY}
      Resend__FromEmail: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      Resend__FromName: ${RESEND_FROM_NAME:-Servika}
      Paystack__SecretKey: ${PAYSTACK_SECRET_KEY}
      # Phone-verification OTP (Termii). Empty => dev stub logs codes.
      Sms__ApiKey: ${SMS_API_KEY:-}
      Sms__SenderId: ${SMS_SENDER_ID:-Servika}
      # Gate booking/chat on a verified phone. Keep false until SMS_API_KEY is set;
      # the API refuses to boot if this is true while Sms__ApiKey is blank.
      Auth__RequirePhoneForBooking: ${REQUIRE_PHONE_FOR_BOOKING:-false}
      Google__DirectionsApiKey: ${GOOGLE_DIRECTIONS_API_KEY}
      Osrm__BaseUrl: ${OSRM_BASE_URL:-}
      Osrm__ApiKey: ${OSRM_API_KEY:-}
      # Google Sign-In: WEB OAuth client id(s), comma-separated (the ID-token
      # audience the API accepts). Empty = the /auth/google endpoint rejects all.
      Google__OAuthClientIds: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      # S3 uploads (KYC docs, photos, booking media). Empty => local disk (ephemeral!).
      Storage__S3Bucket: ${STORAGE_S3_BUCKET:-}
      Storage__S3Region: ${STORAGE_S3_REGION:-}
      Kyc__AutoApprove: ${KYC_AUTOAPPROVE:-false}
    # Published to the server's own port 8080 so we can test it (curl localhost:8080).
    # The firewall still blocks 8080 from the internet; later Caddy will front it on 443.
    ports:
      - '8080:8080'

volumes:
  servika_pgdata:
  servika_redisdata:
